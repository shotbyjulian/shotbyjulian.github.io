<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SBJ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #000000; --sans: 'Inter', sans-serif; }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  body { background-color: var(--bg); font-family: var(--sans); overflow-x: hidden; }

  /* HEADER */
  header {
    position: fixed; top: 0; left: 0; width: 100%;
    padding: 24px; z-index: 100;
    display: flex; justify-content: space-between; align-items: center;
  }
  .logo { color: #333; font-size: 10px; font-weight: 600; text-decoration: none; letter-spacing: 0.2em; }
  
  .setup-btn {
    font-size: 10px; background: none; border: none;
    color: #333; cursor: pointer; text-transform: uppercase; letter-spacing: 0.1em;
  }

  /* MAIN ARCHIVE GRID */
  .archive-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    padding-top: 80px;
  }
  @media (min-width: 1024px) {
    .archive-grid { grid-template-columns: repeat(6, 1fr); gap: 4px; }
  }

  .item { aspect-ratio: 1; background: #050505; cursor: pointer; }
  .item img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }

  /* LIGHTBOX (FOR MAIN IMAGES) */
  #lightbox {
    position: fixed; inset: 0; background: #000; z-index: 1000;
    display: none; align-items: center; justify-content: center; padding: 5vh;
  }
  #lightbox.active { display: flex; }
  #lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }

  /* SETUP MODAL (VERTICAL LOOKBOOK) */
  #setup-modal {
    position: fixed; inset: 0; background: #000; z-index: 1100;
    display: none; flex-direction: column; overflow-y: auto;
    scrollbar-width: none;
  }
  #setup-modal::-webkit-scrollbar { display: none; }
  #setup-modal.active { display: flex; }

  .setup-content img {
    width: 100%;
    height: auto;
    display: block;
    margin-bottom: 2px; /* Yeezy gap */
  }

  .close-setup {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 10px; letter-spacing: 0.2em; cursor: pointer;
    background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 20px;
    backdrop-filter: blur(10px);
  }

</style>
</head>
<body>

<header>
  <a href="#" class="logo">SBJ</a>
  <button class="setup-btn" onclick="toggleSetup(true)">Setup</button>
</header>

<!-- Huvudarkiv (Dina vanliga bilder) -->
<main class="archive-grid" id="grid"></main>

<!-- Lightbox för vanliga bilder -->
<div id="lightbox" onclick="this.classList.remove('active')">
  <img src="" id="lbImg">
</div>

<!-- Setup Modal (Instruktionsbilderna visas bara här) -->
<div id="setup-modal">
  <div class="setup-content">
    <img src="IMG_9775.jpeg">
    <img src="IMG_9776.jpeg">
    <img src="IMG_9777.jpeg">
    <img src="IMG_9778.jpeg">
    <img src="IMG_9779.jpeg">
    <img src="IMG_9780.jpeg">
  </div>
  <div class="close-setup" onclick="toggleSetup(false)">CLOSE</div>
</div>

<script>
  // Ditt bildarkiv (Lägg till alla dina vanliga bilder här)
  const ARCHIVE_FILES = [
    { f: "IMG_9227.jpeg" }, { f: "IMG_9228.jpeg" }, { f: "IMG_9229.jpeg" },
    { b: 1 }, { b: 2 }, { b: 3 }, { b: 4 }, { b: 5 } // osv...
  ];

  const getPath = i => i.f ? i.f : `bild (${i.b}).jpg`;
  const grid = document.getElementById('grid');

  // Bygg huvudarkivet
  ARCHIVE_FILES.forEach(img => {
    const path = getPath(img);
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `<img src="${path}" loading="lazy">`;
    div.onclick = () => {
        document.getElementById('lbImg').src = path;
        document.getElementById('lightbox').classList.add('active');
    };
    grid.appendChild(div);
  });

  function toggleSetup(show) {
    const modal = document.getElementById('setup-modal');
    modal.classList.toggle('active', show);
    document.body.style.overflow = show ? 'hidden' : 'auto';
    if(show) modal.scrollTop = 0;
  }

  // ESC för att stänga allt
  window.addEventListener('keydown', e => {
    if(e.key === "Escape") {
      toggleSetup(false);
      document.getElementById('lightbox').classList.remove('active');
    }
  });
</script>

</body>
</html>
