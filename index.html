<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SBJ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  :root { --bg: #000000; --fg: #444; --sans: 'Inter', sans-serif; --mono: 'JetBrains Mono', monospace; }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  body { background-color: var(--bg); font-family: var(--sans); overflow-x: hidden; color: var(--fg); }

  /* HEADER */
  header {
    position: fixed; top: 0; left: 0; width: 100%;
    padding: 20px 24px; z-index: 100;
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
  }
  .logo { color: var(--fg); font-size: 10px; font-weight: 600; text-decoration: none; letter-spacing: 0.2em; }
  
  .setup-btn {
    font-family: var(--mono); font-size: 10px; background: none; border: 1px solid #222;
    color: var(--fg); cursor: pointer; text-transform: uppercase; padding: 4px 8px;
  }

  /* MAIN ARCHIVE GRID */
  .archive-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    padding-top: 70px;
  }
  @media (min-width: 1024px) {
    .archive-grid { grid-template-columns: repeat(6, 1fr); gap: 4px; }
  }

  .item { aspect-ratio: 1; background: #050505; cursor: pointer; overflow: hidden; }
  .item img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; transition: opacity 0.3s; }
  .item:hover img { opacity: 1; }

  /* LIGHTBOX FOR ARCHIVE */
  #lightbox {
    position: fixed; inset: 0; background: #000; z-index: 1000;
    display: none; align-items: center; justify-content: center; padding: 40px;
  }
  #lightbox.active { display: flex; }
  #lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }

  /* SETUP MODAL */
  #setup-modal {
    position: fixed; inset: 0; background: #000; z-index: 1100;
    display: none; overflow-y: auto; padding: 100px 20px;
    scrollbar-width: none;
  }
  #setup-modal::-webkit-scrollbar { display: none; }
  #setup-modal.active { display: block; }

  .setup-container {
    max-width: 300px; 
    margin: 0 auto;
  }

  .step-block { margin-bottom: 60px; text-align: left; }
  
  .step-label {
    font-family: var(--mono);
    font-size: 9px;
    color: #888;
    margin-bottom: 15px;
    display: block;
    letter-spacing: 0.1em;
  }

  .setup-container img {
    width: 100%;
    height: auto;
    display: block;
    border: 1px solid #111;
  }

  .close-setup {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 10px; letter-spacing: 0.2em; cursor: pointer;
    background: #111; padding: 10px 30px; border-radius: 2px;
  }

</style>
</head>
<body>

<header>
  <a href="#" class="logo">SBJ / ARCHIVE</a>
  <button class="setup-btn" onclick="toggleSetup(true)">Setup</button>
</header>

<main class="archive-grid" id="grid"></main>

<div id="lightbox" onclick="this.classList.remove('active')">
  <img src="" id="lbImg">
</div>

<div id="setup-modal">
  <div class="setup-container">
    <div class="step-block">
      <span class="step-label">STEP 01</span>
      <img src="IMG_9775.jpeg">
    </div>
    <div class="step-block">
      <span class="step-label">STEP 02</span>
      <img src="IMG_9776.jpeg">
    </div>
    <div class="step-block">
      <span class="step-label">STEP 03</span>
      <img src="IMG_9777.jpeg">
    </div>
    <div class="step-block">
      <span class="step-label">STEP 04</span>
      <img src="IMG_9778.jpeg">
    </div>
    <div class="step-block">
      <span class="step-label">STEP 05</span>
      <img src="IMG_9779.jpeg">
    </div>
    <div class="step-block">
      <span class="step-label">STEP 06</span>
      <img src="IMG_9780.jpeg">
    </div>
  </div>
  <div class="close-setup" onclick="toggleSetup(false)">CLOSE</div>
</div>

<script>
  // EXAKT LISTA BASERAT PÅ DINA FILNAMN
  const FILES = [
    // IMG-SERIEN
    "IMG_9227.jpeg", "IMG_9228.jpeg", "IMG_9229.jpeg", "IMG_9230.jpeg", 
    "IMG_9231.jpeg", "IMG_9232.jpeg", "IMG_9233.jpeg", "IMG_9234.jpeg", 
    "IMG_9235.jpeg", "IMG_9236.jpeg", "IMG_9237.jpeg", "IMG_9238.jpeg", 
    "IMG_9239.jpeg", "IMG_9346.jpeg", "IMG_9358.jpeg", "IMG_9364.jpeg", 
    "IMG_9367.jpeg", "IMG_9368.jpeg", "IMG_9378.jpeg", "IMG_9379.jpeg", 
    "IMG_9381.jpeg", "IMG_9383.jpeg", "IMG_9387.jpeg", "IMG_9392.jpeg", 
    "IMG_9394.jpeg",
    // BILD (X).JPG SERIEN
    "bild (1).jpg", "bild (2).jpg", "bild (3).jpg", "bild (4).jpg", 
    "bild (5).jpg", "bild (6).jpg", "bild (7).jpg", "bild (8).jpg", 
    "bild (9).jpg", "bild (10).jpg", "bild (11).jpg", "bild (12).jpg", 
    "bild (13).jpg", "bild (14).jpg", "bild (15).jpg", "bild (16).jpg", 
    "bild (17).jpg", "bild (18).jpg", "bild (19).jpg", "bild (20).jpg", 
    "bild (21).jpg", "bild (22).jpg", "bild (23).jpg", "bild (24).jpg", 
    "bild (25).jpg", "bild (26).jpg", "bild (27).jpg", "bild (28).jpg", 
    "bild (29).jpg", "bild (30).jpg", "bild (31).jpg", "bild (32).jpg", 
    "bild (33).jpg", "bild (34).jpg", "bild (35).jpg", "bild (36).jpg", 
    "bild (37).jpg"
  ];

  const grid = document.getElementById('grid');

  // Skapa rutnätet
  FILES.forEach(fileName => {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `<img src="${fileName}" loading="lazy">`;
    div.onclick = () => {
        document.getElementById('lbImg').src = fileName;
        document.getElementById('lightbox').classList.add('active');
    };
    grid.appendChild(div);
  });

  function toggleSetup(show) {
    const modal = document.getElementById('setup-modal');
    modal.classList.toggle('active', show);
    document.body.style.overflow = show ? 'hidden' : 'auto';
    if(show) modal.scrollTop = 0;
  }

  window.addEventListener('keydown', e => {
    if(e.key === "Escape") {
      toggleSetup(false);
      document.getElementById('lightbox').classList.remove('active');
    }
  });
</script>

</body>
</html>
