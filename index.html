<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SBJ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --fg: #444444; /* Väldigt mörk text, Yeezy-style */
    --active: #cccccc;
    --sans: 'Inter', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  body {
    background-color: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 10px;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    overflow-x: hidden;
  }

  /* DESKTOP LAYOUT (Default) */
  #desktop-ui { display: none; }
  
  @media (min-width: 1024px) {
    #desktop-ui {
      display: grid;
      grid-template-columns: 250px 1fr;
      height: 100vh;
      padding: 40px;
      gap: 40px;
    }
    #mobile-ui { display: none; }

    .sidebar {
      display: flex;
      flex-direction: column;
      justify-content:间-between;
    }

    .nav-list { list-style: none; overflow-y: auto; padding-right: 10px; }
    .nav-item {
      padding: 4px 0;
      cursor: pointer;
      transition: color 0.1s;
      white-space: nowrap;
    }
    .nav-item:hover { color: var(--active); }
    .nav-item.active { color: var(--active); }

    .main-view {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505;
    }
    .main-view img {
      max-height: 85vh;
      max-width: 100%;
      object-fit: contain;
    }
  }

  /* MOBILE LAYOUT */
  #mobile-ui {
    display: flex;
    flex-direction: column;
  }

  .mobile-item {
    width: 100%;
    margin-bottom: 2px; /* Minimalistisk separation */
    background: #050505;
  }

  .mobile-item img {
    width: 100%;
    display: block;
    filter: brightness(0.9);
  }

  .mobile-label {
    padding: 15px 20px;
    font-size: 9px;
    color: #333;
    display: flex;
    justify-content: space-between;
  }

  /* Header */
  header {
    padding: 20px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
    border-bottom: 1px solid #111;
  }

  .logo { color: var(--active); font-weight: 600; text-decoration: none; }

</style>
</head>
<body>

<!-- DESKTOP STRUCTURE -->
<div id="desktop-ui">
  <div class="sidebar">
    <a href="#" class="logo">SBJ</a>
    <ul class="nav-list" id="desktopNav">
      <!-- JS laddar in -->
    </ul>
    <div class="footer-info">
      ARCHIVE-01<br>
      SWEDEN
    </div>
  </div>
  <div class="main-view">
    <img src="" id="mainImg" alt="">
  </div>
</div>

<!-- MOBILE STRUCTURE -->
<div id="mobile-ui">
  <header>
    <a href="#" class="logo">SBJ / INDEX</a>
  </header>
  <div id="mobileGrid">
    <!-- JS laddar in -->
  </div>
</div>

<script>
  // Nischade namn, tekniska referenser
  const IMAGES = [
    { n:"1", name: "CORE.01 / STUTTGART" },
    { n:"5", name: "OXIDE.GREY / 911" },
    { n:"14", name: "TAURO.RAW" },
    { n:"17", name: "ITER.STATIC" },
    { n:"22", name: "IGNIS.LUME" },
    { n:"23", name: "KOMOREBI.VOID" },
    { n:"32", name: "NOIR.ARCHIVE" },
    { n:"35", name: "SPIRIT.MONO" },
    { n:"44", file:"IMG_9227.jpeg", name: "ALPEN.TRACE" },
    { n:"50", file:"IMG_9233.jpeg", name: "ALPEN.ELEVATION" },
    { n:"52", file:"IMG_9394.jpeg", name: "ITALIA.GRAIN" },
    { n:"63", file:"IMG_9346.jpeg", name: "FLORENCE.NULL" }
  ];

  const imgSrc = i => i.file ? `images/${i.file}` : `images/bild (${i.n}).jpg`;

  // Desktop Logic
  const nav = document.getElementById('desktopNav');
  const mainImg = document.getElementById('mainImg');

  IMAGES.forEach((img, idx) => {
    // Desktop list
    const li = document.createElement('li');
    li.className = 'nav-item';
    if(idx === 0) li.classList.add('active');
    li.textContent = img.name;
    li.onmouseover = () => {
      mainImg.src = imgSrc(img);
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      li.classList.add('active');
    };
    nav.appendChild(li);

    // Mobile list
    const mDiv = document.createElement('div');
    mDiv.className = 'mobile-item';
    mDiv.innerHTML = `
      <img src="${imgSrc(img)}" loading="lazy">
      <div class="mobile-label">
        <span>${img.name}</span>
        <span>${String(idx + 1).padStart(2, '0')}</span>
      </div>
    `;
    document.getElementById('mobileGrid').appendChild(mDiv);
  });

  // Set initial image for desktop
  if(IMAGES.length > 0) mainImg.src = imgSrc(IMAGES[0]);

</script>
</body>
</html>
